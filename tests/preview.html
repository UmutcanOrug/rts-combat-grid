<!doctype html><html lang="en"><meta charset="utf-8"><title>RTS Combat Grid · SWADE</title><link rel="stylesheet" href="/styles/grid.css">
<style>
body{margin:0;background:#101a1c;color:#e1e7df;font:14px/1.6 'Segoe UI',sans-serif;min-height:100vh;background-image:radial-gradient(ellipse at 40% 45%,#384b3b44,transparent 55%),linear-gradient(#1f302566 1px,transparent 1px),linear-gradient(90deg,#1f302566 1px,transparent 1px);background-size:auto,64px 64px,64px 64px}
.preview-bar{position:absolute;top:24px;left:30px;right:30px;display:flex;gap:12px;align-items:center}.preview-bar b{font-size:18px;letter-spacing:1px;margin-right:auto}.preview-bar button{background:#1f343d;border:1px solid #557078;color:#d6e8e8;border-radius:4px;padding:9px 14px;cursor:pointer}.preview-label{position:absolute;left:30px;bottom:24px;color:#839b92;font-size:12px}.demo-token{position:absolute;left:34%;top:35%;width:84px;height:84px;border-radius:50%;border:3px solid #b6c7a1;box-shadow:0 0 0 6px #1b2c1ccc,0 3px 20px #000b;cursor:pointer;object-fit:cover}.demo-name{position:absolute;left:calc(34% - 25px);top:calc(35% + 100px);width:140px;text-align:center;font-weight:600;color:#c9d6b7}.preview-output{position:absolute;left:30px;top:90px;font-size:12px;color:#8ab79c;white-space:pre-line;max-width:320px}dialog{color:#e2ebee;background:#18252d;border:1px solid #698799;border-radius:6px;padding:0;max-height:92vh;width:650px;box-shadow:0 18px 80px #000c}dialog::backdrop{background:#0007}dialog header{display:flex;justify-content:space-between;padding:12px 18px;background:#233640;font-weight:600}dialog .window-content{padding:20px}dialog select{height:32px}dialog input,dialog select,dialog textarea{background:#0e1b23;border:1px solid #4c6371;color:#dfebf1;padding:7px;border-radius:3px;font:inherit}dialog button{background:#294353;color:#dfebf1;border:1px solid #52788e;border-radius:3px;padding:7px;cursor:pointer}dialog footer{display:flex;justify-content:flex-end;gap:8px;padding-top:15px}#token-hud{position:absolute;left:calc(34% + 100px);top:35%}.rcg-launcher{width:40px;height:40px;background:#202d2b;color:#d9e6dc;border:1px solid #798b7e}.rcg-launcher i::before{content:"▦";font-size:26px}.rcg{bottom:65px}
</style>
<div class="preview-bar"><b>RTS COMBAT GRID <small style="font-size:10px;color:#8ba99d">/ SWADE</small></b><button id="coh-theme">CoH II · Frontline</button><button id="sc2-theme">SC II · Terran</button><button id="open-panel">Open panel</button></div>
<img id="unit" class="demo-token" src="/assets/coh2/rifleman.webp" alt="Token"><span class="demo-name">4th Infantry Company</span>
<div class="preview-output" id="output">Right-click the token, then click its grid icon.
This is a local interface preview; it does not modify a Foundry world.</div>
<span class="preview-label">FROM TOKEN TO COMMAND · Customizable pages and buttons</span><div id="token-hud"><div class="col left"><button type="button" aria-label="Combat">Combat</button></div><div class="col right"></div></div>
<script type="module" src="/tests/browser-harness.mjs"></script></html>
